name: CI

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      playwright-image: ${{ steps.playwright-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Resolve Playwright image from lockfile
        id: playwright-image
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const version = lock.packages["node_modules/@playwright/test"].version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`Unsupported Playwright image version: ${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `image=mcr.microsoft.com/playwright:v${version}-noble\n`);
          JS
      - run: npm ci
      - name: Check pull request title (squash commit)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run commitlint
      - run: npm run ci
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.check.outputs.playwright-image }}
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run patch:release-tools
      - name: Verify preinstalled Chromium
        run: |
          node --input-type=module <<'JS'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch();
          console.log(`Preinstalled Chromium: ${browser.version()}`);
          await browser.close();
          JS
      - run: npm run build
      # Split individual tests, including the large workbench.spec.ts suite.
      # Keep one worker per runner to preserve isolation and stable resource use.
      - run: npm run ci:e2e -- --shard=${{ matrix.shard }}/3
        env:
          E2E_PRODUCTION: "1"
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
