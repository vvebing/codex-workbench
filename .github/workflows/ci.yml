name: CI

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run patch:release-tools
      - name: Check pull request title (squash commit)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm run commitlint
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run build
      - run: npm run test:package
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run patch:release-tools
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Split individual tests, including the large workbench.spec.ts suite.
      # Keep one worker per runner to preserve isolation and stable resource use.
      - run: npm run test:e2e -- --fully-parallel --workers=1 --shard=${{ matrix.shard }}/3
        env:
          E2E_PRODUCTION: "1"
