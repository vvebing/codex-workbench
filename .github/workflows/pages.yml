name: Deploy interactive demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "public/icons/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public static demo
        run: |
          mkdir -p _site/icons
          cp pages/index.html pages/style.css pages/app.js pages/.nojekyll _site/
          cp public/icons/product-icon.png public/icons/favicon.png _site/icons/
          node --check _site/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
