name: Deploy interactive demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "vite.demo.config.ts"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "server/codex-version.ts"
      - "tests/demo/**"
      - "tests/unit/demo-transport.test.ts"
      - "tests/fixtures/demo-server.mjs"
      - "playwright.demo.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npx vitest run tests/unit/demo-transport.test.ts
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.demo.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
